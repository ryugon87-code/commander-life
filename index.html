<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="shortcut icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="pixfont.css">
<title>Commander Life</title>
<style>
  :root{--pix:"PixFont","Press Start 2P",monospace;}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;-moz-user-select:none;user-select:none;}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:-apple-system,"Roboto","Segoe UI",Arial,sans-serif;touch-action:manipulation;color:#fff;}

  #grid{position:absolute;inset:0;display:grid;gap:8px;padding:8px;background:#000;}
  .q{position:relative;overflow:hidden;border-radius:22px;background:#444;transition:box-shadow .2s;}
  .q .bg{position:absolute;inset:0;background-size:cover;background-position:center top;}
  .q .scrim{position:absolute;inset:0;background:rgba(0,0,0,0);}
  .q.hasimg .scrim{background:rgba(0,0,0,.34);}
  .q.dead .frame{filter:grayscale(1) brightness(.42);}
  .q.dead .out{display:flex;}
  .q.active{box-shadow:inset 0 0 0 5px #ffd54a,0 0 22px rgba(255,213,74,.5);}

  /* one rotated frame per quad — all children in the player's own coordinate system */
  .frame{position:absolute;inset:0;}

  .qtap{position:absolute;top:0;bottom:0;width:42%;display:flex;align-items:center;z-index:3;}
  .qtap.L{left:0;justify-content:flex-start;} .qtap.R{right:0;justify-content:flex-end;}
  .qtap:active{background:rgba(255,255,255,.09);}
  .sign{font-size:7vh;font-weight:800;color:rgba(255,255,255,.5);padding:0 6%;text-shadow:0 1px 4px rgba(0,0,0,.4);}

  .life{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-weight:800;line-height:1;color:#fff;font-variant-numeric:tabular-nums;text-shadow:0 3px 0 rgba(0,0,0,.35);z-index:2;}
  .delta{position:absolute;left:0;right:0;top:17%;text-align:center;font-weight:800;color:#fff;opacity:0;transition:opacity .2s;z-index:4;pointer-events:none;text-shadow:0 2px 8px rgba(0,0,0,.6);}
  .delta.show{opacity:.92;}
  .out{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);display:none;text-align:center;font-weight:900;letter-spacing:.2em;color:rgba(255,255,255,.92);z-index:6;text-shadow:0 3px 12px #000;}

  .qhead{position:absolute;left:4%;right:4%;top:3%;display:flex;gap:5px;justify-content:center;align-items:center;z-index:8;}
  .pills{position:absolute;left:6%;right:6%;top:67%;display:flex;flex-wrap:wrap;gap:4px;justify-content:center;z-index:4;pointer-events:none;}
  .pill{min-width:26px;height:24px;padding:0 8px;border-radius:12px;background:rgba(0,0,0,.6);color:#fff;font-family:var(--pix);font-size:10px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.3);}
  .pill.hot{background:#c62828;border-color:#ff8a80;}
  /* floating mana: round pips like the card symbols */
  .manarow{position:absolute;left:4%;right:4%;top:17.5%;display:flex;gap:6px;justify-content:center;z-index:7;}
  .mp{display:flex;align-items:center;gap:3px;background:rgba(8,8,10,.7);border:1px solid rgba(255,255,255,.28);border-radius:14px;padding:2px 7px 2px 2px;box-shadow:0 2px 8px rgba(0,0,0,.45);}
  .mp:active{transform:scale(.92);}
  .mp i,.msym,.mcol .ms{font-style:normal;display:flex;align-items:center;justify-content:center;}
  .mp i{width:3.4vh;height:3.4vh;min-width:24px;min-height:24px;}
  .mp i svg,.msym svg,.mcol .ms svg{width:100%;height:100%;display:block;}
  .mp b{font-family:var(--pix);font-size:max(10px,1.6vh);color:#fff;font-weight:400;}
  .qb .mtot{background:#ffd54a;color:#222;border-radius:6px;padding:1px 4px;}
  /* in-quad mana panel: lives inside the rotated frame, so it faces its player */
  .mpanel{position:absolute;inset:0;z-index:20;background:rgba(6,6,8,.9);display:flex;flex-direction:column;container-type:size;padding:2.5cqh 2cqw;gap:2cqh;}
  .mph{display:flex;align-items:center;gap:2cqw;height:14cqh;flex:none;}
  .mph span{flex:1;min-width:0;white-space:nowrap;text-align:center;font-family:var(--pix);font-size:clamp(9px,7cqh,15px);color:#fff;}
  .mph button{height:100%;min-height:30px;padding:0 3cqw;border:1px solid #555;border-radius:8px;background:#222;color:#fff;font-family:var(--pix);font-size:clamp(8px,6cqh,13px);}
  .mph button.x{background:#c62828;border-color:#ff8a80;min-width:44px;}
  .mph button:active{transform:scale(.93);}
  .mpc{flex:1;display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:1fr;gap:1.5cqh 1.5cqw;min-height:0;}
  @container (orientation: portrait){ .mpc{grid-template-columns:repeat(3,1fr);} .mph span{display:none;} .mph{justify-content:flex-end;} }
  .mcol{display:flex;flex-direction:column;align-items:center;gap:4%;min-height:0;container-type:size;}
  .mcol button{width:100%;flex:1 1 0;min-height:22px;border:0;border-radius:10px;background:#2c2c2c;color:#fff;font-size:clamp(16px,11cqh,30px);font-weight:800;line-height:1;}
  .mcol button:active{background:#555;transform:scale(.93);}
  .mcol .ms{position:relative;flex:0 0 auto;width:min(100cqw,42cqh);height:min(100cqw,42cqh);}
  .mcol .ms b{position:absolute;right:-18%;bottom:-8%;min-width:50%;padding:1px 3px;border-radius:7px;background:#000;border:1px solid #777;color:#fff;font-family:var(--pix);font-size:clamp(9px,6cqh,15px);font-weight:400;text-align:center;}
  .mcol .ms.zero svg{opacity:.4;}
  .mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;max-width:760px;}
  .mtile{background:#161616;border:1px solid #2a2a2a;border-radius:14px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;}
  .mtile.on{border-color:#666;}
  .msym{width:64px;height:64px;font-size:22px;}
  .msym:active{transform:scale(.92);}
  .mtile .mn{font-family:var(--pix);font-size:26px;}
  .mtile .ml{font-size:12px;color:#999;}
  .mtile .mb{display:flex;gap:6px;}
  .mtile .mb button{width:44px;height:40px;border:0;border-radius:8px;background:#333;color:#fff;font-size:20px;font-weight:800;}
  .mtile .mb button:active{background:#555;}

  .qbot{position:absolute;left:5%;right:5%;bottom:3%;display:flex;gap:4px;justify-content:center;align-items:flex-end;flex-wrap:wrap;z-index:8;}
  .qb{font-family:var(--pix);font-size:10px;color:rgba(255,255,255,.92);background:rgba(8,8,10,.66);border:1px solid rgba(255,255,255,.22);border-radius:8px;padding:7px 8px;box-shadow:0 2px 8px rgba(0,0,0,.4);display:flex;align-items:center;gap:4px;white-space:nowrap;}
  .qb:active{background:rgba(0,0,0,.85);transform:scale(.93);}
  .qb i{font-style:normal;font-size:11px;color:#fff;}
  .pname{font-family:var(--pix);font-size:10px;color:#fff;background:rgba(8,8,10,.66);border:1px solid rgba(255,255,255,.22);border-radius:8px;padding:7px 9px;max-width:44vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:uppercase;letter-spacing:.03em;}

  .ic{width:30px;height:30px;border-radius:8px;background:rgba(8,8,10,.62);border:1px solid rgba(255,255,255,.24);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.4);flex:none;}
  .ic:active{background:rgba(0,0,0,.85);transform:scale(.9);}
  .ic svg{width:17px;height:17px;fill:rgba(255,255,255,.92);}
  .ic.crownon{background:linear-gradient(145deg,#ffe082,#ffb300);border-color:#fff3c4;} .ic.crownon svg{fill:#4a3600;}

  .qb-danno{flex-direction:column;align-items:center;gap:4px;}
  .qb-danno .drow{display:flex;gap:7px;justify-content:center;}
  .dmini{display:flex;flex-direction:column;align-items:center;gap:2px;}
  .pipseat{display:grid;gap:2px;}
  .pipseat i{width:6px;height:6px;background:rgba(255,255,255,.22);border-radius:1px;}
  .pipseat i.on{background:#ff8c00;}
  .pipseat.leth i.on{background:#ff3b30;}
  .dnum{font-family:var(--pix);font-size:10px;color:#fff;line-height:1;text-align:center;}
  .dnum.leth{color:#ff5252;}

  /* global controls — board dead-centre, never overlaps quad content (which sits at each quad's outer edge) */
  #center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:30;display:flex;flex-direction:column;align-items:stretch;gap:4px;background:#000;border:1px solid #2a2a2a;border-radius:13px;padding:9px;box-shadow:0 4px 16px rgba(0,0,0,.6);width:200px;}
  #center .clk{font-family:var(--pix);font-size:16px;color:#fff;letter-spacing:.03em;text-align:center;}
  #center .clk.paused{color:#777;}
  #center .turnclk{font-family:var(--pix);font-size:11px;color:#9aa;text-align:center;letter-spacing:.02em;}
  #center #cTurn{width:100%;}
  #center .row{display:flex;gap:3px;}
  #center button{flex:1;font-family:var(--pix);font-size:8px;color:#e8e8e8;background:#1a1a1a;border:1px solid #555;border-radius:7px;padding:9px 2px;display:flex;align-items:center;justify-content:center;min-height:30px;}
  #center button svg{width:13px;height:13px;}
  #center button:active{background:#333;}


  .sheet{position:absolute;inset:0;background:rgba(0,0,0,.95);z-index:50;display:none;flex-direction:column;}
  .sheet.on{display:flex;}
  .sheet .hd{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid #222;}
  .sheet .hd h2{font-size:13px;flex:1;font-family:var(--pix);}
  .sheet .hd button{background:#c62828;border:0;color:#fff;border-radius:8px;padding:10px 18px;font-size:13px;font-weight:800;font-family:var(--pix);}
  .sheet .bd{flex:1;overflow-y:auto;padding:12px 16px 60px;}
  .grp{margin:16px 0 4px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#888;}
  .orow{display:flex;align-items:center;gap:10px;width:100%;max-width:720px;margin:6px 0;background:#161616;border-radius:10px;padding:9px 12px;}
  .orow .lbl{flex:1;font-size:15px;}
  .orow .val{font-size:22px;font-weight:800;min-width:44px;text-align:center;}
  .orow button{width:50px;height:50px;border:0;border-radius:8px;background:#333;color:#fff;font-size:24px;font-weight:800;flex:none;}
  .orow button:active{background:#555;}
  .orow input[type=text]{flex:1;background:#0c0c0c;border:1px solid #333;color:#fff;border-radius:8px;padding:10px;font-size:15px;}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0;}
  .chip{background:#222;border:1px solid #333;border-radius:16px;padding:9px 15px;font-family:var(--pix);font-size:11px;}
  .chip.sel{background:#3d6bff;border-color:#3d6bff;}
  .swatch{width:40px;height:40px;border-radius:50%;border:3px solid transparent;}
  .swatch.sel{border-color:#fff;}
  .grad{width:64px;height:40px;border-radius:8px;border:3px solid transparent;}
  .grad.sel{border-color:#fff;}
  .btn{display:inline-block;background:#2a2a2a;border:1px solid #3a3a3a;border-radius:10px;padding:12px 16px;font-family:var(--pix);font-size:11px;margin:5px 6px 0 0;}
  .btn:active{background:#3a3a3a;} .btn.danger{background:#7a1c1c;border-color:#a33;}
  .tip{background:#141414;border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.6;color:#bbb;margin-top:6px;}

  #dice{align-items:center;justify-content:center;text-align:center;}
  #dieStage{position:relative;width:100%;height:40vh;display:flex;align-items:center;justify-content:center;margin-bottom:2vh;}
  #stagePersp{width:32vh;height:32vh;perspective:900px;}
  .d20{width:100%;height:100%;-webkit-transform-style:preserve-3d;transform-style:preserve-3d;filter:drop-shadow(0 14px 16px rgba(0,0,0,.55));}
  .d20.rolling{-webkit-animation:d20roll 1.05s cubic-bezier(.25,.6,.2,1) forwards;animation:d20roll 1.05s cubic-bezier(.25,.6,.2,1) forwards;}
  @-webkit-keyframes d20roll{0%{-webkit-transform:rotateZ(0) rotateY(0) rotateX(0) scale(.4)}55%{-webkit-transform:rotateZ(560deg) rotateY(400deg) rotateX(230deg) scale(1.06)}100%{-webkit-transform:rotateZ(1080deg) rotateY(720deg) rotateX(360deg) scale(1)}}
  @keyframes d20roll{0%{transform:rotateZ(0) rotateY(0) rotateX(0) scale(.4)}55%{transform:rotateZ(560deg) rotateY(400deg) rotateX(230deg) scale(1.06)}100%{transform:rotateZ(1080deg) rotateY(720deg) rotateX(360deg) scale(1)}}
  #d20num{font-family:var(--pix);fill:#c62828;}
  #diceRes{position:absolute;font-family:var(--pix);font-size:22vh;line-height:1;color:#fff;opacity:0;transform:scale(.4);text-shadow:0 4px 0 rgba(0,0,0,.4);}
  #diceRes.show{opacity:1;transform:scale(1);transition:opacity .25s,transform .3s cubic-bezier(.2,1.6,.4,1);}
  #diceLabel{position:absolute;bottom:1vh;font-family:var(--pix);font-size:14px;letter-spacing:.1em;color:#888;}
  #dice .dbtns{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;max-width:600px;}
  #dice .dbtns button{background:#222;border:1px solid #444;border-radius:12px;color:#fff;font-family:var(--pix);font-size:13px;padding:13px 15px;min-width:60px;}
  #dice .dbtns button:active{background:#3d6bff;}
  #dice .dclose{margin-top:14px;background:#c62828;border:0;color:#fff;border-radius:10px;padding:14px 40px;font-family:var(--pix);font-size:12px;}
  #diceLog{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:620px;margin-top:14px;min-height:26px;}
  #diceLog span{font-family:var(--pix);font-size:11px;background:#1c1c1c;border:1px solid #333;border-radius:9px;padding:5px 9px;color:#bbb;}
  #diceLog span b{color:#fff;}

  #stChart{width:100%;max-width:760px;background:#0d0d0d;border:1px solid #222;border-radius:12px;}
  .stleg{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;}
  .stleg div{display:flex;align-items:center;gap:6px;font-size:14px;}
  .stleg i{width:14px;height:14px;border-radius:3px;display:inline-block;}
  #stTime{font-family:var(--pix);font-size:24px;margin:6px 0 2px;}

  .cardItem{border-radius:9px;overflow:hidden;background:#161616;border:1px solid #2a2a2a;}
  .cardItem .thumb{width:100%;height:92px;background-size:cover;background-position:center;background-color:#222;}
  .cardItem .cn{font-size:11px;padding:6px 7px;line-height:1.25;color:#ddd;}
  .cardItem:active{border-color:#3d6bff;}

  #toast{position:absolute;left:50%;bottom:46px;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:9px 16px;border-radius:8px;font-size:14px;z-index:60;opacity:0;transition:opacity .3s;text-align:center;max-width:80%;}
  #toast.show{opacity:1;}
  input[type=file]{display:none;}
</style>
</head>
<body>
<div id="grid"></div>
<div id="center">
  <div class="clk" id="clk">0:00</div>
  <div class="turnclk" id="turnclk" style="display:none"></div>
  <button id="cTurn" style="display:none">TURNO &#9654;</button>
  <div class="row">
    <button id="cDice">DADI</button>
    <button id="cStats">STATS</button>
    <button id="cUndo">&#8630;</button>
    <button id="cFs" title="Schermo intero"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 3h7v2H5v5H3V3zm11 0h7v7h-2V5h-5V3zM3 14h2v5h5v2H3v-7zm16 0h2v7h-7v-2h5v-5z"/></svg></button>
    <button id="cMenu">&#8942;</button>
  </div>
</div>

<div class="sheet" id="pSheet"><div class="hd"><h2 id="pTitle"></h2><button id="pClose">Chiudi</button></div><div class="bd" id="pBody"></div></div>
<div class="sheet" id="sSheet"><div class="hd"><h2>Impostazioni</h2><button id="sClose">Chiudi</button></div><div class="bd" id="sBody"></div></div>

<div class="sheet" id="dice">
  <div id="dieStage">
    <div id="stagePersp">
      <svg class="d20" id="d20" viewBox="0 0 100 100">
        <g stroke="#7f8290" stroke-width="1" stroke-linejoin="round">
          <polygon points="50,4 90,27 50,33"  fill="#eef0f4"/>
          <polygon points="10,27 50,4 50,33"  fill="#f7f8fb"/>
          <polygon points="32,64 10,27 50,33" fill="#e2e4ea"/>
          <polygon points="10,73 10,27 32,64" fill="#d6d9e1"/>
          <polygon points="50,96 10,73 32,64" fill="#cdd0da"/>
          <polygon points="68,64 50,96 32,64" fill="#dfe1e8"/>
          <polygon points="90,73 50,96 68,64" fill="#c7cad4"/>
          <polygon points="90,27 90,73 68,64" fill="#d1d4dd"/>
          <polygon points="50,33 90,27 68,64" fill="#e7e9ef"/>
          <polygon points="50,33 68,64 32,64" fill="#ffffff"/>
        </g>
        <polygon points="10,27 50,4 90,27 90,73 50,96 10,73" fill="none" stroke="#5b5e6b" stroke-width="1.6" stroke-linejoin="round"/>
        <text id="d20num" x="50" y="60" text-anchor="middle" font-size="24" font-weight="700">20</text>
      </svg>
    </div>
    <div id="diceRes"></div>
    <div id="diceLabel"></div>
  </div>
  <div class="dbtns" id="diceBtns"></div>
  <div id="diceLog"></div>
  <button class="dclose" id="diceClose">Chiudi</button>
</div>

<div class="sheet" id="stats"><div class="hd"><h2>Statistiche partita</h2><button id="stClose">Chiudi</button></div>
  <div class="bd"><div id="stTime"></div><div id="stWho" style="color:#aaa;margin-bottom:10px"></div>
  <svg id="stChart" viewBox="0 0 400 210" preserveAspectRatio="none"></svg>
  <div class="stleg" id="stLeg"></div>
  <div style="margin-top:16px"><span class="btn" id="stEnd">Fine partita &amp; azzera</span></div></div>
</div>

<div class="sheet" id="focus"><div class="hd"><h2 id="fTitle"></h2><button id="fClose">Torna al gioco</button></div><div class="bd" id="fBody"></div></div>
<div class="sheet" id="cmdDmg"><div class="hd"><h2 id="cdTitle"></h2><button id="cdClose">Torna al gioco</button></div><div class="bd" id="cdBody"></div></div>

<div class="sheet" id="cards"><div class="hd"><h2>Scegli una carta</h2><button id="cardsClose">Chiudi</button></div>
  <div style="padding:10px 16px 0"><input type="text" id="cardSearch" placeholder="Cerca comandante..." style="width:100%;background:#0c0c0c;border:1px solid #333;color:#fff;border-radius:8px;padding:11px;font-size:15px"></div>
  <div class="bd"><div id="cardGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px"></div></div>
</div>

<div class="sheet" id="cam"><div class="hd"><h2>Foto dalla fotocamera</h2><button id="camClose">Annulla</button></div>
  <div class="bd" style="display:flex;flex-direction:column;align-items:center;gap:14px">
    <video id="camVid" autoplay playsinline muted style="max-width:100%;max-height:56vh;border-radius:12px;background:#000"></video>
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
      <span class="btn" id="camShot">Scatta</span>
      <span class="btn" id="camFlip">Cambia camera</span>
    </div>
    <div id="camErr" style="color:#f88;font-size:14px;text-align:center;max-width:480px"></div>
  </div>
</div>

<input type="file" id="filePick" accept="image/*">
<input type="file" id="importPick" accept="application/json,.json">
<div id="toast"></div>

<script src="art/cards.js"></script>
<script>

var AC=window.AudioContext||window.webkitAudioContext, actx=null;
function audio(){ if(!actx&&AC){ try{ actx=new AC(); }catch(e){} } if(actx&&actx.state==="suspended"){ try{ actx.resume(); }catch(e){} } return actx; }
function tone(freq,dur,type,vol,when){
  var a=actx; if(!a) return;
  var o=a.createOscillator(),g=a.createGain();
  o.type=type||"sine"; o.frequency.value=freq;
  var t=a.currentTime+(when||0);
  g.gain.setValueAtTime(Math.max(0.0001,vol||0.2),t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur);
}
function sfx(name){
  if(!st.sound) return; if(!audio()) return;
  if(name==="dice"){ for(var i=0;i<6;i++) tone(110+Math.random()*90,0.05,"square",0.10,i*0.07); tone(880,0.13,"triangle",0.18,0.5); tone(1320,0.18,"sine",0.12,0.6); }
  else if(name==="bell"){ tone(659,0.28,"sine",0.22,0); tone(988,0.5,"sine",0.16,0.13); }
  else if(name==="win"){ [523,659,784,1047].forEach(function(f,i){ tone(f,0.18,"triangle",0.18,i*0.12); }); }
  else if(name==="tick"){ tone(1200,0.02,"sine",0.04,0); }
}

function maxCmdDmg(pl){ var m=0; for(var k in pl.cmdDmg){ if(pl.cmdDmg[k]>m) m=pl.cmdDmg[k]; } return m; }

function setCmdrCount(pi,count){
  snap();
  var opp=st.p[pi];
  if(count===2){
    if(!opp.cmdrs) opp.cmdrs=[{name:"Comandante 1",art:null}];
    if(opp.cmdrs.length<2) opp.cmdrs.push({name:"Comandante 2",art:null});
    if(opp.cmdrs[0] && opp.cmdrs[0].name==="Comandante") opp.cmdrs[0].name="Comandante 1";
  } else {
    // merge every receiver's slot-1 damage from pi back into slot-0
    for(var r=0;r<6;r++){ if(r===pi) continue; var cd=st.p[r].cmdDmg||{};
      if(cd[pi+"|1"]){ cd[pi+"|0"]=(cd[pi+"|0"]||0)+cd[pi+"|1"]; }
      delete cd[pi+"|1"];
    }
    opp.cmdrs=[ (opp.cmdrs&&opp.cmdrs[0]) || {name:"Comandante",art:null} ];
  }
  save(); build();
}

/* seats in clockwise table order (top row L->R, right col, bottom row R->L, left col) */
function cwOrder(){
  var L=layoutFor(), cols=L.cols, rows=Math.ceil(st.n/cols), g=[], r, c, out=[];
  for(r=0;r<rows;r++){ g[r]=[]; for(c=0;c<cols;c++){ var idx=r*cols+c; g[r][c]=(idx<st.n)?idx:null; } }
  function add(v){ if(v!=null && out.indexOf(v)<0) out.push(v); }
  for(c=0;c<cols;c++) add(g[0][c]);
  for(r=1;r<rows;r++) add(g[r][cols-1]);
  for(c=cols-2;c>=0;c--) add(g[rows-1][c]);
  for(r=rows-2;r>=1;r--) add(g[r][0]);
  return out;
}
function nextSeatCW(cur){ var o=cwOrder(), p=o.indexOf(cur); return o[(p+1)%o.length]; }

/* ---------- layout ---------- */
function layoutFor(){
  if(st.layout==="pinwheel" && st.n===4) return PINWHEEL4;
  return LAYOUTS[st.n];
}

var grid=document.getElementById("grid"), bgCache={}, qmOpen={};
function build(){
  var L=layoutFor();
  var portrait=window.innerHeight>window.innerWidth;
  var cols=L.cols, rows=L.rows;
  if(portrait && st.n<=3 && st.layout!=="pinwheel"){ cols=1; rows=st.n; }
  grid.style.gridTemplateColumns="repeat("+cols+",1fr)";
  grid.style.gridTemplateRows="repeat("+rows+",1fr)";
  grid.innerHTML="";
  for(var i=0;i<st.n;i++){
    var q=makeQ(i,L);
    if(i===st.n-1 && cols===2 && st.n%2===1) q.style.gridColumn="span 2";  /* last seat takes the empty cell */
    grid.appendChild(q);
  }
  for(var k=0;k<grid.children.length;k++) grid.children[k]._fit();
  document.getElementById("cTurn").style.display=st.turnMode?"":"none";
  renderClock();
}

function dannoBtn(i){

    var row=document.createElement("div"); row.className="drow";
    keys.forEach(function(oi){
      var slots=Object.keys(byOpp[oi]).sort(), lethal=false;
      var parts=slots.map(function(s){ if(byOpp[oi][s]>=21) lethal=true; return byOpp[oi][s]; });
      var cell=document.createElement("div"); cell.className="dmini";
      cell.appendChild(seatPip(+oi,lethal));
      var num=document.createElement("div"); num.className="dnum"+(lethal?" leth":"");
      num.textContent=parts.join("-");    // "3-2" = two commanders from the same player
      cell.appendChild(num);
      row.appendChild(cell);
    });
    b.appendChild(row);
  }
  return b;
}

function histPush(i){
  var pl=st.p[i]; pl.hist=pl.hist||[];
  var t=st.match.elapsed, last=pl.hist[pl.hist.length-1];
  if(last && last.t===t) last.l=pl.life; else pl.hist.push({t:t,l:pl.life});
  if(pl.hist.length>600) pl.hist.shift();
}

function tapRepeat(el,fn){
  var touchMode=false, holdT=null, repT=null, sx=0, sy=0, reps=0;
  function begin(x,y){
    sx=x; sy=y; reps=0; fn();
    holdT=setTimeout(function(){
      repT=setInterval(function(){ reps++; fn(); if(reps===8&&repT){ clearInterval(repT); repT=setInterval(fn,230); } },430);
    },650);
  }
  function end(){ if(holdT){clearTimeout(holdT);holdT=null;} if(repT){clearInterval(repT);repT=null;} }
  el.addEventListener("touchstart",function(e){ touchMode=true; if(e.cancelable) e.preventDefault(); begin(e.touches[0].clientX,e.touches[0].clientY); },{passive:false});
  el.addEventListener("touchmove",function(e){ var t=e.touches[0]; if(Math.abs(t.clientX-sx)>24||Math.abs(t.clientY-sy)>24) end(); },{passive:true});
  el.addEventListener("touchend",function(e){ if(e.cancelable) e.preventDefault(); end(); },{passive:false});
  el.addEventListener("touchcancel",end);
  el.addEventListener("mousedown",function(e){ if(touchMode) return; begin(e.clientX,e.clientY); });
  window.addEventListener("mouseup",function(){ if(!touchMode) end(); });
}

function norm(s){ try{ s=s.normalize("NFD").replace(/[̀-ͯ]/g,""); }catch(e){} return s.toLowerCase().replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim(); }
function lev(a,b){
  if(a===b) return 0; if(!a.length) return b.length; if(!b.length) return a.length;
  var prev=[],i,j; for(j=0;j<=b.length;j++) prev[j]=j;
  for(i=1;i<=a.length;i++){ var cur=[i];
    for(j=1;j<=b.length;j++){ var cost=a.charAt(i-1)===b.charAt(j-1)?0:1;
      cur[j]=Math.min(cur[j-1]+1,prev[j]+1,prev[j-1]+cost); }
    prev=cur; }
  return prev[b.length];
}
function subseq(q,t){ var i=0; for(var j=0;j<t.length&&i<q.length;j++) if(q.charAt(i)===t.charAt(j)) i++; return i===q.length; }
function fuzzyScore(name,q){
  if(!q) return 1;
  var n=norm(name), qn=norm(q); if(!qn) return 1;
  if(n.indexOf(qn)>=0) return 1000 - n.indexOf(qn);              // substring
  var qt=qn.split(" "), nt=n.split(" ");
  if(qt.every(function(t){ return n.indexOf(t)>=0; })) return 700; // all tokens present
  // per-token: prefix of a word, or close typo of a word
  var s=0, ok=true;
  qt.forEach(function(t){
    var best=99;
    nt.forEach(function(w){
      if(w.indexOf(t)===0) best=Math.min(best,1);
      else { var d=lev(t,w); if(d<=Math.max(1,Math.floor(t.length/4))) best=Math.min(best,1+d); }
    });
    if(best===99) ok=false; else s+=best;
  });
  if(ok) return 500 - s*20;
  if(subseq(qn.replace(/ /g,""), n.replace(/ /g,""))) return 200; // scattered letters in order
  var dd=lev(qn, n.slice(0,qn.length+2));
  if(dd<=3) return 120 - dd*10;
  return 0;
}

    var pl=st.p[p], hist=pl.hist&&pl.hist.length?pl.hist:[{t:0,l:pl.life}];
    var pts=hist.map(function(h){ return X(h.t).toFixed(1)+","+Y(h.l).toFixed(1); });
    if(hist[hist.length-1].t<maxT) pts.push(X(maxT).toFixed(1)+","+Y(hist[hist.length-1].l).toFixed(1));
    var poly=document.createElementNS("http://www.w3.org/2000/svg","polyline");
    poly.setAttribute("points",pts.join(" ")); poly.setAttribute("fill","none");
    poly.setAttribute("stroke",pl.color); poly.setAttribute("stroke-width","2.4");
    poly.setAttribute("stroke-linejoin","round"); poly.setAttribute("stroke-linecap","round");
    chart.appendChild(poly);
    var dead=isDead(pl);
    if(!dead){ aliveCount++; if(pl.life>aliveHi){ aliveHi=pl.life; winner=p; } }
    var d=document.createElement("div"); var ii=document.createElement("i"); ii.style.background=pl.color;
    d.appendChild(ii); var sp=document.createElement("span"); sp.textContent=pl.name+": "+pl.life+(dead?" (OUT)":""); d.appendChild(sp);
    leg.appendChild(d);
  }
  document.getElementById("stTime").textContent="Tempo: "+fmt(st.match.elapsed);
  document.getElementById("stWho").textContent = aliveCount===1 ? ("Vince "+st.p[winner].name+"!") : (aliveCount===0?"Tutti eliminati":"In gioco: "+aliveCount);
  if(aliveCount===1 && !st.match.winPlayed){ st.match.winPlayed=true; save(); sfx("win"); }
  statsSheet.className="sheet on";
}

/* ---------- centre controls ---------- */
document.getElementById("cUndo").addEventListener("click",undo);
document.getElementById("cTurn").addEventListener("click",function(){
  snap();
  var nx=st.active, guard=0;
  do{ nx=nextSeatCW(nx); guard++; }while(isDead(st.p[nx]) && guard<st.n);  /* skip eliminated players */
  if(st.manaClear) st.p.forEach(clearMana);
  st.active=nx; st.turn=(st.turn||1)+1; st.match.turnElapsed=0; save(); build(); sfx("bell"); vib(30);
});

/* ---------- fullscreen ---------- */
function isFs(){ return document.fullscreenElement||document.webkitFullscreenElement||document.mozFullScreenElement; }
function goFs(){ var el=document.documentElement; var fn=el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen; if(fn){ try{ fn.call(el); }catch(e){} } }
function exitFs(){ var ex=document.exitFullscreen||document.webkitExitFullscreen||document.mozCancelFullScreen; if(ex){ try{ ex.call(document); }catch(e){} } }
var userExitedFs=false;
function fsChange(){ if(!isFs()) userExitedFs=true; else userExitedFs=false; }
document.addEventListener("fullscreenchange",fsChange);
document.addEventListener("webkitfullscreenchange",fsChange);
document.addEventListener("mozfullscreenchange",fsChange);
document.getElementById("cFs").addEventListener("click",function(){
  if(isFs()){ userExitedFs=true; exitFs(); }
  else { userExitedFs=false; goFs(); }
});
document.addEventListener("touchend",function(){
  audio(); wake();
  if(!isFs() && !userExitedFs) goFs();
},true);

var tEl=document.getElementById("toast"),tT=null;
function toast(m){ tEl.textContent=m; tEl.className="show"; if(tT)clearTimeout(tT); tT=setTimeout(function(){ tEl.className=""; },1600); }

var rez=null;
window.addEventListener("resize",function(){ if(rez)clearTimeout(rez); rez=setTimeout(build,250); });

/* trap BACK */
try{ history.pushState({k:1},""); }catch(e){}
window.addEventListener("popstate",function(){
  var open=document.querySelector(".sheet.on");
  if(open){ if(open.id==="cam") stopCam(); open.className="sheet"; }
  try{ history.pushState({k:1},""); }catch(e){}
});

/* service worker (http only) */
if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){
  navigator.serviceWorker.register("sw.js").catch(function(){});
}

/* keep the screen on during a game (Screen Wake Lock API, https only) */
var wl=null;
function wake(){
  if(!st.wakeLock){ if(wl){ try{ wl.release(); }catch(e){} wl=null; } return; }
  if(wl || !navigator.wakeLock || document.visibilityState!=="visible") return;
  navigator.wakeLock.request("screen").then(function(l){ wl=l; l.addEventListener("release",function(){ wl=null; }); }).catch(function(){});
}
document.addEventListener("visibilitychange",function(){ if(document.visibilityState==="visible") wake(); else save(); });
document.addEventListener("click",wake,true);
window.addEventListener("pagehide",save);
window.addEventListener("beforeunload",save);
wake();
openIDB().then(build);
})();
</script>
